name: Nyam
options:
  bundleIdPrefix: ai.gojuly.nyam
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Nyam:
    type: application
    platform: iOS
    sources:
      - path: Nyam
        excludes:
          - "Preview Content"
      - path: Nyam/Preview Content
        buildPhase: resources
    resources:
      - Nyam/Assets.xcassets
    info:
      path: Nyam/Info.plist
      properties:
        CFBundleDisplayName: Nyam
        UILaunchScreen:
          UIColorName: AccentColor
        NSCameraUsageDescription: Nyam needs the camera to scan your meal.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - armv7
    entitlements:
      path: Nyam/Nyam.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.gojuly.nyam
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        ENABLE_PREVIEWS: "YES"
        DEVELOPMENT_ASSET_PATHS: '"Nyam/Preview Content"'
        GENERATE_INFOPLIST_FILE: "NO"
